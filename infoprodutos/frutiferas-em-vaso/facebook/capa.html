<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa da página do Facebook</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  /* 1640x624. O celular corta as laterais: o texto fica no meio da imagem */
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1640px; height: 624px; font-family: Inter, "Segoe UI", Arial, sans-serif; color: #fff;
    background: radial-gradient(circle at 50% 30%, #2f6b3a 0%, #1f4a28 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  small { font-size: 26px; font-weight: 800; letter-spacing: .24em; text-transform: uppercase; color: #f2a33a; }
  h1 { font-size: 92px; font-weight: 900; letter-spacing: -.035em; line-height: 1; margin: 22px 0 20px; }
  p { font-size: 32px; font-weight: 600; opacity: .9; }
</style>
</head>
<body>
  <small>Frutífera em vaso</small>
  <h1>Sua frutífera vai dar fruto</h1>
  <p>Mesmo em apartamento · Dicas com fontes da Embrapa e de universidades</p>
</body>
</html>
